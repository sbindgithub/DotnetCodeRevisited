name: .NET CI

on:
  push:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - run: dotnet restore src/Playground/Playground.csproj
      - run: dotnet build src/Playground/Playground.csproj --no-restore
      - run: dotnet test src/Playground.Tests