name: CD-Deploy-Mock

on:
  workflow_run:
    workflows: ["CI-With-Tests"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Application
        run: echo "Auto-deploying to production"

      - name: Health Check
        run: echo "Running smoke tests"

      - name: Rollback (Mock)
        if: failure()
        run: echo "Rollback triggered"